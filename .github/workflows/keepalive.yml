name: Supabase Keep-Alive

# Mantém o projeto Supabase ativo no plano gratuito.
# Roda automaticamente a cada 3 dias (e pode ser disparado manualmente).
on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, 12:00 UTC (09:00 no horário de Brasília)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase (mantém ativo)
        run: |
          echo "Enviando requisicao ao Supabase em $(date)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/colaboradores?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          echo "Codigo HTTP recebido: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "Sucesso: projeto respondeu e foi mantido ativo."
          else
            echo "Atencao: resposta inesperada (HTTP $HTTP_CODE)."
            exit 1
          fi
