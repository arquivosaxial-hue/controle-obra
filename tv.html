<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Painel de Obras — Construtora Axial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-data.js"></script>
<style>
:root{--bg:#0d1b2a;--panel:#14253a;--line:#274057;--txt:#eaf2f9;--txt2:#9bb3c9;--accent:#3a9bdc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#frame{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:var(--bg)}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:10;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
#loading .t{font-size:18px;font-weight:700}
#loading .s{font-size:13px;color:var(--txt2)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
/* faixa de progresso das obras (discreta, topo) */
#queue{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);z-index:9}
#queue .bar{height:100%;background:var(--accent);width:0;transition:width .3s linear}
#err{position:fixed;top:10px;left:10px;right:10px;background:#e0584a;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:20;display:none}
</style></head><body>
<div id="queue"><div class="bar" id="qbar"></div></div>
<div id="err"></div>
<iframe id="frame" title="painel"></iframe>
<div id="loading"><div class="spin"></div><div class="t">Painel de Obras — Construtora Axial</div><div class="s" id="lsub">Carregando obras…</div></div>

<script>
// ===== Maestro: cicla pelas telas das obras do banco =====
// Cada "parada" da fila é uma URL (a tela especialista) + duração.
// Obra com mapa  -> diretoria-tv.html?obra=NUMERO  (já cicla 3 telas internas)
// Recomposição   -> diretoria-igua.html?obra=NUMERO (dashboard de categorias)

const DUR_MAPA = 40000; // ms numa obra com mapa (passa pelas 3 telas internas)
const DUR_DASH = 16000; // ms num dashboard de recomposição

let fila = [];
let idx = 0;
let timer = null;

function showErr(msg){
  const e=document.getElementById('err');
  e.textContent='Aviso: '+msg; e.style.display='block';
  setTimeout(()=>e.style.display='none', 8000);
}

async function montarFila(){
  const obras = await window.ObraData.listObras();
  const f = [];
  for (const o of obras){
    if (o.tem_mapa){
      f.push({ url:`diretoria-tv.html?obra=${encodeURIComponent(o.numero)}`,
               dur:DUR_MAPA, nome:o.nome });
    } else {
      // recomposição (ex: Iguá) -> dashboard de categorias
      f.push({ url:`diretoria-igua.html?obra=${encodeURIComponent(o.numero)}`,
               dur:DUR_DASH, nome:o.nome });
    }
  }
  return f;
}

function irPara(i){
  if(!fila.length) return;
  idx = ((i % fila.length)+fila.length) % fila.length;
  const parada = fila[idx];
  const frame = document.getElementById('frame');
  frame.src = parada.url;
  // barra de progresso da fila
  document.getElementById('qbar').style.width = (((idx+1)/fila.length)*100)+'%';
  // agenda a próxima
  clearTimeout(timer);
  timer = setTimeout(()=>irPara(idx+1), parada.dur);
}

(async function start(){
  try{
    fila = await montarFila();
    if(!fila.length){
      document.getElementById('lsub').textContent='Nenhuma obra cadastrada no banco.';
      return;
    }
    document.getElementById('lsub').textContent =
      fila.length+' obra(s) na fila. Iniciando…';
    // esconde o loading depois de um instante e começa
    setTimeout(()=>{
      document.getElementById('loading').classList.add('hide');
      irPara(0);
    }, 900);
  }catch(e){
    console.error(e);
    document.getElementById('lsub').textContent='Erro ao carregar obras: '+(e.message||e);
    showErr(e.message||e);
  }
})();

// recarrega a fila a cada 5 min (para captar obras novas sem reiniciar a TV)
setInterval(async ()=>{
  try{
    const nova = await montarFila();
    if(nova.length && nova.length!==fila.length){ fila = nova; }
  }catch(e){ /* silencioso */ }
}, 300000);
</script></body></html>
